const data=JSON.parse(document.getElementById('content').textContent);let lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'ka',mode=0,client='codex';const $=id=>document.getElementById(id);
function text(id,value){$(id).textContent=value}function renderPrompt(){const d=data[lang];text('prompt',d.prompts[mode].replaceAll('{skill}',client==='codex'?'$creator-flow':'/creator-flow'));text('status','');document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',Number(b.dataset.mode)===mode);b.setAttribute('aria-pressed',String(Number(b.dataset.mode)===mode))});document.querySelectorAll('[data-client]').forEach(b=>{b.classList.toggle('active',b.dataset.client===client);b.setAttribute('aria-pressed',String(b.dataset.client===client))})}
function renderCaptions(){
 const c=data[lang].captions;
 for(const [id,key] of Object.entries({'caption-title':'title','caption-intro':'intro','caption-note':'note','caption-delivery':'delivery','caption-docs':'link'}))text(id,c[key]);

 $('caption-options').replaceChildren(...c.items.map(([title,body])=>{const card=document.createElement('article');card.className='caption-option';const h=document.createElement('h3');h.textContent=title;const p=document.createElement('p');p.textContent=body;card.append(h,p);return card}));
}
function renderThumbnails(){
 const c=data[lang].thumbnails;
 for(const[id,key]of Object.entries({'thumbnail-title':'title','thumbnail-intro':'intro','thumbnail-guest':'guest','thumbnail-host':'host','thumbnail-topic':'topic','thumbnail-copy':'copy','thumbnail-layout-note':'note','thumbnail-episode':'episode','thumbnail-episode-body':'episodeBody','thumbnail-clip':'clip','thumbnail-clip-body':'clipBody','thumbnail-delivery':'delivery','thumbnail-docs':'link'}))text(id,c[key]);
 $('thumbnail-docs').href='https://github.com/AvtandilMghebrishvili/creator-flow/blob/main/docs/USER_GUIDE.'+lang+'.md#thumbnails';
}
function render(){renderCaptions();renderThumbnails();const d=data[lang];document.documentElement.lang=lang;document.querySelectorAll('[data-lang]').forEach(b=>{b.classList.toggle('active',b.dataset.lang===lang);b.setAttribute('aria-pressed',String(b.dataset.lang===lang))});for(const [id,key] of Object.entries({label:'label',subtitle:'subtitle',flowtitle:'flowTitle',flownote:'flowNote',footer:'footer',teasertitle:'teaserTitle',teasernote:'teaserNote',copytitle:'copyTitle',copynote:'copyNote',copy:'copy'}))text(id,d[key]);$('headline').replaceChildren();d.title.split('<br>').forEach((part,i)=>{if(i)$('headline').append(document.createElement('br'));$('headline').append(document.createTextNode(part))});
$('routes').innerHTML=d.routes.map(r=>`<article class="route"><div class="routehead"><span class="tag">${r[0]}</span><div class="screen ${r[4]}"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 2l13 8-13 8z" fill="currentColor"/></svg></div></div><h2>${r[1]}</h2><p>${r[2]}</p><span class="ratio">${r[3]}</span></article>`).join('');
$('steps').innerHTML=d.steps.map((s,i)=>`<article class="step"><span class="num">${String(i+1).padStart(2,'0')}</span><div><h3>${s[0]}</h3><p>${s[1]}</p><span class="chip">${s[2]}</span></div></article>`).join('');['teaser','bodyclip','total'].forEach((id,i)=>text(id,d.teaser[i]));$('modes').innerHTML=d.modes.map((m,i)=>`<button data-mode="${i}">${m}</button>`).join('');document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=Number(b.dataset.mode);renderPrompt()});text('docs',d.docs+' ↗');$('docs').href='https://github.com/AvtandilMghebrishvili/creator-flow/blob/main/docs/USER_GUIDE.'+lang+'.md';renderPrompt()}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()});document.querySelectorAll('[data-client]').forEach(b=>b.onclick=()=>{client=b.dataset.client;renderPrompt()});$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('prompt').textContent);text('status',data[lang].copied)}catch{const range=document.createRange();range.selectNodeContents($('prompt'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);text('status',data[lang].fallback)}};render();
